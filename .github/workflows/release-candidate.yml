name: Release candidate

# Builds the products of one version tag. The gate workflow calls this workflow
# when a new tag appears on the main branch. A manual start repeats a failed
# platform build, because the tag then already exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag, for example v0.1.1
        type: string
        required: true
      signed:
        description: Verify Windows/macOS signatures and macOS notarization
        type: boolean
        default: true
      desktop_targets:
        description: A comma-separated desktop target list from release.json, or all
        type: string
        default: all
      container_platforms:
        description: A comma-separated container platform list from release.json, or all
        type: string
        default: all
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      signed:
        type: boolean
        default: true
      desktop_targets:
        type: string
        default: all
      container_platforms:
        type: string
        default: all

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify the tag and the main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/check.mjs --tag="$RELEASE_TAG"
          default_branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          git fetch --quiet --no-tags origin "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
          git merge-base --is-ancestor HEAD "origin/$default_branch"
          echo "The tag $RELEASE_TAG is on the main branch." >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: verify-tag
    uses: ./.github/workflows/desktop-build.yml
    with:
      signed: ${{ inputs.signed }}
      targets: ${{ inputs.desktop_targets }}

  containers:
    needs: verify-tag
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ inputs.container_platforms }}

  assemble:
    needs: [desktop, containers]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Assemble the same run and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_TARGETS: ${{ inputs.desktop_targets }}
          CONTAINER_PLATFORMS: ${{ inputs.container_platforms }}
        run: |
          set -euo pipefail
          for target in $(node scripts/release/platforms.mjs desktop "$DESKTOP_TARGETS"); do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "desktop-$target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir "incoming/$target"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "containers-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir incoming/containers
          node scripts/release/candidate.mjs assemble incoming release-artifacts/candidate --desktop="$DESKTOP_TARGETS" --containers="$CONTAINER_PLATFORMS"
          echo "Candidate $GITHUB_SHA (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT). Platforms: desktop=$DESKTOP_TARGETS containers=$CONTAINER_PLATFORMS. Complete acceptance-template.json before release." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/candidate/
          # The assembler copies only allowlisted assets, including the empty
          # deployment/.env.example template; no local .env is copied.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
