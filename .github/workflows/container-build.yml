name: Container candidate build
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Resolve the selected platforms
        id: resolve
        shell: bash
        env:
          CONTAINER_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          echo "matrix=$(node scripts/release/platforms.mjs containers "$CONTAINER_PLATFORMS" --matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: candidate
    env:
      # Disposable operator account for this isolated candidate smoke stack.
      DBRAIN_ADMIN_EMAIL: ci@dbrain.invalid
      DBRAIN_ADMIN_PASSWORD: ci-operator-password
      DBRAIN_CONTAINER_ARCH: ${{ matrix.arch }}
      DBRAIN_VERSION: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      DBRAIN_PORT: "13080"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure candidate image names
        shell: bash
        run: echo "DBRAIN_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached pocketbase image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/pocketbase/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-pocketbase:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-pocketbase-${{ matrix.arch }}
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-pocketbase-{0}', matrix.arch) || '' }}
      - name: Build cached server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-server:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-server-${{ matrix.arch }}
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-server-{0}', matrix.arch) || '' }}
      - name: Build cached web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-web:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-web-${{ matrix.arch }}
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-web-{0}', matrix.arch) || '' }}
      - name: Install media fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Accept the built images before pushing
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p dbrain-candidate -f docker-compose.yml -f deploy/compose.test.yml up --no-build --wait --wait-timeout 180
          node scripts/release/server-smoke.mjs
        env:
          DBRAIN_SMOKE_SERVER_URL: http://127.0.0.1:13081
          DBRAIN_SMOKE_PB_URL: http://127.0.0.1:13090
          DBRAIN_SMOKE_WEB_URL: http://127.0.0.1:13080
          DBRAIN_SMOKE_ADMIN_EMAIL: ci@dbrain.invalid
          DBRAIN_SMOKE_ADMIN_PASSWORD: ci-operator-password
      - name: Push tested candidate images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node scripts/release/container-images.mjs push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/containers/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
      - if: failure()
        run: docker compose -p dbrain-candidate -f docker-compose.yml -f deploy/compose.test.yml logs --tail=60
      - if: always()
        run: docker compose -p dbrain-candidate -f docker-compose.yml -f deploy/compose.test.yml down -v
      - if: always()
        run: docker logout ghcr.io
  merge:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: candidate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Merge tested platform digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DBRAIN_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "container-$arch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir incoming
          done
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node scripts/release/container-images.mjs merge incoming
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containers-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/containers/container-report.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: docker logout ghcr.io
