name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: bash scripts/release/check-workflows.sh
      - run: pnpm check-types
      - run: pnpm lint:gate
      - run: pnpm test:release
      - name: Check build and release script syntax
        run: |
          for script in scripts/lib/*.mjs scripts/release/*.mjs scripts/dev-pocketbase.mjs scripts/dev-pocketbase-admin.mjs apps/desktop/scripts/*.mjs apps/server/scripts/*.mjs; do
            node --check "$script"
          done
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/release/download-pocketbase.mjs
      - run: pnpm --filter server build
      - run: pnpm smoke:server
      - run: pnpm --filter desktop runtime:prepare
      - run: node apps/desktop/scripts/backend-smoke.mjs
      - run: pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
  containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # `docker-compose.yml` treats the PocketBase operator account as required
      # configuration, so every compose invocation in this job (up, logs, down)
      # needs it. The account is upserted by the image entrypoint on start; the
      # stack and its data are throwaway.
      DBRAIN_ADMIN_EMAIL: ci@dbrain.invalid
      DBRAIN_ADMIN_PASSWORD: ci-operator-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start isolated containers
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml up --build --wait --wait-timeout 180
        env:
          DBRAIN_IMAGE_PREFIX: dbrain-ci
          DBRAIN_VERSION: test
          DBRAIN_PORT: "13080"
      - name: Install media fixture dependency
        # The smoke client creates media fixtures outside the containers.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify container runtime and browser endpoints
        run: node scripts/release/server-smoke.mjs
        env:
          DBRAIN_SMOKE_SERVER_URL: http://127.0.0.1:13081
          DBRAIN_SMOKE_PB_URL: http://127.0.0.1:13090
          DBRAIN_SMOKE_WEB_URL: http://127.0.0.1:13080
          # Same credentials as the job env above: the smoke run then proves the
          # operator account the image entrypoint upserted actually authenticates.
          DBRAIN_SMOKE_ADMIN_EMAIL: ci@dbrain.invalid
          DBRAIN_SMOKE_ADMIN_PASSWORD: ci-operator-password
      - if: failure()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml logs --tail=60
      - if: always()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml down -v
