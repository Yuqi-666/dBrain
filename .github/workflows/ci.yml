name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm test:release
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/release/download-pocketbase.mjs
      - run: pnpm --filter server build
      - run: pnpm smoke:server
      - run: pnpm --filter desktop runtime:prepare
      - run: node apps/desktop/scripts/backend-smoke.mjs
      - run: pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
  containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start isolated containers
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml up --build --wait --wait-timeout 180
        env:
          DBRAIN_IMAGE_PREFIX: dbrain-ci
          DBRAIN_VERSION: test
          DBRAIN_PORT: "13080"
      - name: Verify container runtime and browser endpoints
        run: node scripts/release/server-smoke.mjs
        env:
          DBRAIN_SMOKE_SERVER_URL: http://127.0.0.1:13081
          DBRAIN_SMOKE_PB_URL: http://127.0.0.1:13090
          DBRAIN_SMOKE_WEB_URL: http://127.0.0.1:13080
      - if: failure()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml logs --tail=60
      - if: always()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml down -v
