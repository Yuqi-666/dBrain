name: CI
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  changes:
    # Drafts do not allocate a runner; ready_for_review starts validation.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      check: ${{ steps.scope.outputs.check }}
      containers: ${{ steps.scope.outputs.containers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select checks from the complete changed-file list
        run: node scripts/release/ci-scope.mjs
  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore web Next.js build cache
        id: next-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.mjs', 'apps/**/*.js', 'apps/**/*.json', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.js', 'packages/**/*.mjs', 'packages/**/*.json', 'backend/**/*.ts', 'backend/**/*.json', 'scripts/**/*.mjs', 'apps/**/*.css', 'packages/**/*.css', 'packages/**/*.scss', 'apps/*/public/**', 'packages/*/public/**', '*.json', '*.yaml', '!**/node_modules/**', '!**/.next/**', '!**/dist/**', '!**/target/**', '!**/runtime/**') }}
          restore-keys: next-v1-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - run: pnpm release:check
      - run: bash scripts/release/check-workflows.sh
      - run: pnpm check-types
      - run: pnpm lint:gate
      - run: pnpm test:release
      - name: Check build and release script syntax
        run: |
          for script in scripts/lib/*.mjs scripts/release/*.mjs scripts/dev-pocketbase.mjs scripts/dev-pocketbase-admin.mjs apps/desktop/scripts/*.mjs apps/server/scripts/*.mjs; do
            node --check "$script"
          done
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/release/download-pocketbase.mjs
      - run: pnpm --filter server build
      - run: pnpm smoke:server
      - run: pnpm --filter desktop runtime:prepare
      - run: node apps/desktop/scripts/backend-smoke.mjs
      - run: pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Save web Next.js build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
  containers:
    needs: [changes, check]
    # Dependency PRs retain quality/backend checks; main and manual candidates
    # validate the integrated container stack before deployment.
    if: needs.changes.outputs.containers == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # `docker-compose.yml` treats the PocketBase operator account as required
      # configuration, so every compose invocation in this job (up, logs, down)
      # needs it. The account is upserted by the image entrypoint on start; the
      # stack and its data are throwaway.
      DBRAIN_ADMIN_EMAIL: ci@dbrain.invalid
      DBRAIN_ADMIN_PASSWORD: ci-operator-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated CI image names
        run: |
          echo "DBRAIN_IMAGE_PREFIX=dbrain-ci" >> "$GITHUB_ENV"
          echo "DBRAIN_VERSION=test" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached pocketbase image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/pocketbase/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-pocketbase:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-pocketbase-amd64
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-pocketbase-amd64' || '' }}
      - name: Build cached server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-server:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-server-amd64
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-server-amd64' || '' }}
      - name: Build cached web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.DBRAIN_IMAGE_PREFIX }}-web:${{ env.DBRAIN_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,version=2,scope=dbrain-v1-web-amd64
          # Only default-branch builds publish reusable caches. PRs restore.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,version=2,mode=max,ignore-error=true,scope=dbrain-v1-web-amd64' || '' }}
      - name: Start the cached images for integration checks
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml up --no-build --wait --wait-timeout 180
        env:
          DBRAIN_PORT: "13080"
      - name: Install media fixture dependency
        # The smoke client creates media fixtures outside the containers.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify container runtime and browser endpoints
        run: node scripts/release/server-smoke.mjs
        env:
          DBRAIN_SMOKE_SERVER_URL: http://127.0.0.1:13081
          DBRAIN_SMOKE_PB_URL: http://127.0.0.1:13090
          DBRAIN_SMOKE_WEB_URL: http://127.0.0.1:13080
          # Same credentials as the job env above: the smoke run then proves the
          # operator account the image entrypoint upserted actually authenticates.
          DBRAIN_SMOKE_ADMIN_EMAIL: ci@dbrain.invalid
          DBRAIN_SMOKE_ADMIN_PASSWORD: ci-operator-password
      - if: failure()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml logs --tail=60
      - if: always()
        run: docker compose -p dbrain-ci -f docker-compose.yml -f deploy/compose.test.yml down -v
