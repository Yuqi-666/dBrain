name: Gate

# The push gate. The local command `pnpm gate` writes a trailer into the commit
# message. This workflow reads it and runs the stages that need a clean runner.
#
#   verify    A pull request proves that the author used the local entry.
#   merged    A push to main proves that the change arrived as a merge of
#             gated commits.
#   tag       A version without a tag becomes a tag.
#   release   A new tag starts the release candidate build.
#
# The verify and merged jobs copy the verifier from a trusted commit and run
# that copy. A change cannot weaken the judge that reads it.

on:
  pull_request:
    branches: [main]
    # A label decides a protected-path change, so the label itself must run the
    # check again. Without `labeled`, the verdict could only change on a push.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build the release candidate for the current version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # A draft pull request allocates no runner.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # The verifier reads the labels of the pull request to decide a
    # protected-path change. The workflow sets `contents: read` for every job,
    # which leaves every other scope at `none`, so the label read needs its own
    # grant. The labels of a pull request answer to both scopes, so the job
    # asks for both.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify the push gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_PR_NUMBER: ${{ format('{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$GATE_HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error title=Push gate::The checkout holds no head commit $GATE_HEAD_SHA."
            exit 1
          fi
          source_sha="$GATE_BASE_SHA"
          if [ -z "$source_sha" ] || ! git cat-file -e "$source_sha:scripts/gate/verify.mjs" 2>/dev/null; then
            echo "::warning title=Push gate::The base commit holds no verifier. The job reads the commit under test."
            source_sha="$GATE_HEAD_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/gate-base"
          git archive "$source_sha" scripts/gate | tar -x -C "$RUNNER_TEMP/gate-base"
          node "$RUNNER_TEMP/gate-base/scripts/gate/verify.mjs" \
            --repo="$GITHUB_REPOSITORY" \
            --base="$GATE_BASE_SHA" \
            --head="$GATE_HEAD_SHA" \
            --require-signature

  merged:
    # A push to the main branch, or a manual start from the main branch.
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify the merge on the main branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$GATE_HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error title=Push gate::The checkout holds no head commit $GATE_HEAD_SHA."
            exit 1
          fi
          source_sha="$(git rev-parse "$GATE_HEAD_SHA^1")"
          if ! git cat-file -e "$source_sha:scripts/gate/verify.mjs" 2>/dev/null; then
            echo "::warning title=Push gate::The previous main tip holds no verifier. The job reads the pushed commit."
            source_sha="$GATE_HEAD_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/gate-base"
          git archive "$source_sha" scripts/gate | tar -x -C "$RUNNER_TEMP/gate-base"
          node "$RUNNER_TEMP/gate-base/scripts/gate/verify.mjs" \
            --repo="$GITHUB_REPOSITORY" \
            --head="$GATE_HEAD_SHA" \
            --merge \
            --require-signature

  tag:
    needs: merged
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # This job pushes the tag. It needs the checkout credentials.
          fetch-depth: 0
      - name: Create the version tag when it is missing
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="v$(node -p "require('./scripts/release/release.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            changed="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" -- scripts/release/release.json)"
            if [ -z "$changed" ]; then
              echo "The version did not change in this push. No release starts."
              exit 0
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "The tag $version already exists."
            exit 0
          fi
          git tag "$version"
          git push origin "$version"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created the tag $version" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [merged, tag]
    # A new tag starts the candidate build. A manual start can repeat it after a
    # failed platform build, because the tag then already exists.
    if: needs.tag.outputs.created == 'true' || github.event.inputs.release == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
      signed: true
