version: 2
# The upper limit stays at zero.
# A bot pull request carries no gate trailer, and the verifier rejects it.
# A dependency update arrives through the local gate: run `pnpm up` in the
# workspace, then run `pnpm gate`. Read docs/ci-cd.md.
updates:
  - package-ecosystem: npm
    directory: /
    # 首版发布期间暂停常规升级；恢复时按生态分组。
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    # 首版发布期间暂停常规升级；恢复时按生态分组。
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    # 首版发布期间暂停常规升级；恢复时按生态分组。
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
